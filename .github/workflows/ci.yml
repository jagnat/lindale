name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          release: dev-2026-05

      # Type-check every plugin except the template through its build script
      - name: Check plugins
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for d in plugins/*/; do
            [ "$d" = "plugins/template/" ] && continue
            echo "== check ${d} =="
            "${d}build.sh" check
          done

      # cmd so the Windows runner exercises build.bat
      - name: Check plugins (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /d %%d in (plugins\*) do (
            if /i not "%%~nxd"=="template" (
              echo == check %%d ==
              call "%%d\build.bat" check || exit /b 1
            )
          )

      # The plugin check never compiles vst_host/platform_specific, so check the
      # static layer once (picks up per-OS platform code)
      - name: Check host layer
        working-directory: plugins/facet
        run: odin check vst3 -collection:lindale=../../src -define:PLUGIN_ID=facet -define:HOT_DLL=true -no-entry-point

      - name: Test dsp
        run: odin test src/dsp

      - name: Test sdk
        run: odin test src/sdk
